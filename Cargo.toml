[workspace]
members = [
    "crates/codeburn-core",
    "crates/codeburn-tui",
    "crates/codeburn-csv",
    "crates/codeburn-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
glob = "0.3"
regex = "1.10"
rayon = "1.12"
thiserror = "2.0"
dashmap = "6.1"
toml = "1.1.2"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
